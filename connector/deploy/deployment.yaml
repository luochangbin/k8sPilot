apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-connector
  namespace: k8spilot
  labels:
    app: ai-agent-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-connector
  template:
    metadata:
      labels:
        app: ai-agent-connector
    spec:
      serviceAccountName: ai-agent-connector
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: ai-agent-connector:phase3
          imagePullPolicy: IfNotPresent
          env:
            # Phase 3 optional data sources (observability namespace). Empty
            # disables the capability and keeps the connector Kubernetes-only.
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
