apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-connector
  namespace: k8spilot
  labels:
    app: ai-agent-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-connector
  template:
    metadata:
      labels:
        app: ai-agent-connector
    spec:
      serviceAccountName: ai-agent-connector
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: connector:phase5
          imagePullPolicy: IfNotPresent
          env:
            # Phase 3 optional data sources (observability namespace). Empty
            # disables the capability and keeps the connector Kubernetes-only.
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            # Phase 5 alert webhook: the Agent Service address reachable from
            # this pod (this deployment: the Windows host on the VMnet8 bridge).
            - name: AGENT_URL
              value: http://192.168.81.1:8001
            - name: ALERT_FORWARD_TIMEOUT_SECONDS
              value: "10"
            - name: ALERT_SNAPSHOT_EVENT_LIMIT
              value: "10"
            - name: ALERT_MAX_BATCH
              value: "100"
            # Shared bearer token required on POST /alerts (Secret is optional;
            # auth is disabled when the key is absent).
            - name: ALERT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-connector-alerts
                  key: webhook-token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
