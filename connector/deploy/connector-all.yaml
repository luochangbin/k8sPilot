apiVersion: v1
kind: Namespace
metadata:
  name: k8spilot

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-connector
  namespace: k8spilot

---
# Read-only RBAC for the connector. Phase 1 carries no write permissions
# (create/update/patch/delete) anywhere in the system.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-connector-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - namespaces
      - services
      - endpoints
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-connector-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agent-connector-readonly
subjects:
  - kind: ServiceAccount
    name: ai-agent-connector
    namespace: k8spilot

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-connector
  namespace: k8spilot
  labels:
    app: ai-agent-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-connector
  template:
    metadata:
      labels:
        app: ai-agent-connector
    spec:
      serviceAccountName: ai-agent-connector
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: ai-agent-connector:phase3
          imagePullPolicy: IfNotPresent
          env:
            # Phase 3 optional data sources (observability namespace). Empty
            # disables the capability and keeps the connector Kubernetes-only.
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-connector
  namespace: k8spilot
spec:
  selector:
    app: ai-agent-connector
  ports:
    - name: http
      port: 8080
      targetPort: http
