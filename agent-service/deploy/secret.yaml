# Create the real LLM API key secret outside version control:
#   kubectl -n k8spilot create secret generic agent-service-secret \
#     --from-literal=LLM_API_KEY=<your-key>
# This committed manifest intentionally contains only a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: agent-service-secret
  namespace: k8spilot
type: Opaque
stringData:
  LLM_API_KEY: "<your-api-key>"
