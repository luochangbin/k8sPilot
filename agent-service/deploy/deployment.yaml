apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: k8spilot
  labels:
    app: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent
          image: agent-service:phase1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: agent-service-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-service-secret
                  key: LLM_API_KEY
            - name: DIAGNOSIS_DB
              value: /data/diagnoses.db
            # Same persistent volume: traces must survive restarts too.
            - name: TRACE_DIR
              value: /data/trace
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-service-data
