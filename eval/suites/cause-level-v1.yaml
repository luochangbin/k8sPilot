id: cause-level-v1
description: Pinned cause-level baseline (root cause vocabulary v2). Every entry
  resolves to eval/cases/versions/<id>.v<version>.yaml with a frozen fixture, so
  this suite can be replayed as the cause-level baseline. Use cause-level.yaml
  while iterating (it tracks the current definitions).
# Critical cases: a wrong root cause here is not averaged away by easy cases.
