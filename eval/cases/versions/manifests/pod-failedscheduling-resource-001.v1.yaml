apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-failedscheduling-resource-001
---
apiVersion: v1
kind: Pod
metadata:
  name: sched-resource-demo
  namespace: eval-pod-failedscheduling-resource-001
  labels:
    app: sched-resource-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10000"
