apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-imagepullauth-001
---
apiVersion: v1
kind: Pod
metadata:
  name: imagepullauth-demo
  namespace: eval-pod-imagepullauth-001
  labels:
    app: imagepullauth-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: localhost:5000/private/app:v1
      # No imagePullSecrets and no local registry: pull always fails.
