apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-abstain-restart-001
---
apiVersion: v1
kind: Pod
metadata:
  name: abstain-restart-demo
  namespace: eval-pod-abstain-restart-001
  labels:
    app: abstain-restart-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      # First run exits with a non-obvious code; on restart it runs forever.
      # The agent sees restart_count=1 with no further signal -> must abstain.
      command: ["sh", "-c", "if [ ! -f /tmp/ok ]; then touch /tmp/ok; exit 9; fi; sleep 3600"]
