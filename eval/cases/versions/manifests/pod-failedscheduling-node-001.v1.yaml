apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-failedscheduling-node-001
---
apiVersion: v1
kind: Pod
metadata:
  name: sched-node-demo
  namespace: eval-pod-failedscheduling-node-001
  labels:
    app: sched-node-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
  nodeSelector:
    gpu: "true"
