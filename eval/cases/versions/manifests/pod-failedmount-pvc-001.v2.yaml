apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-failedmount-pvc-001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: never-bound-pvc
  namespace: eval-pod-failedmount-pvc-001
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: does-not-exist-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: failedmount-pvc-demo
  namespace: eval-pod-failedmount-pvc-001
  labels:
    app: failedmount-pvc-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: never-bound-pvc
