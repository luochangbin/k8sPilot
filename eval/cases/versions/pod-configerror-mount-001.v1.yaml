schema_version: eval.k8spilot.io/v1alpha1
id: pod-configerror-mount-001
case_version: "1"
suite: phase1
description: Container mounts a volume from a missing ConfigMap, container cannot start
target:
  apiVersion: v1
  kind: Pod
  namespace: eval-pod-configerror-mount-001
  name: configerror-mount-demo
setup:
  manifests:
    - manifests/pod-configerror-mount-001.yaml
inject:
  action: apply
ready_when:
  type: jsonpath_equals
  path: status.phase
  value: Pending
  timeout_seconds: 120
ground_truth:
  accepted_root_cause_codes: [CONFIG_ERROR]
  required_evidence:
    - source: kubernetes.events
      operator: equals
      value: FailedMount
  abstention_expected: false
budgets:
  diagnosis_timeout_seconds: 180
  max_tool_calls: 12
cleanup:
  action: delete_manifest
