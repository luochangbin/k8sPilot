schema_version: eval.k8spilot.io/v1alpha1
id: pod-failedscheduling-resource-001
case_version: "1"
suite: phase1
description: Pod requests more resources than any node can provide, stays Unschedulable
target:
  apiVersion: v1
  kind: Pod
  namespace: eval-pod-failedscheduling-resource-001
  name: sched-resource-demo
setup:
  manifests:
    - manifests/pod-failedscheduling-resource-001.yaml
inject:
  action: apply
ready_when:
  type: jsonpath_equals
  path: status.phase
  value: Pending
  timeout_seconds: 90
ground_truth:
  accepted_root_cause_codes: [SCHEDULING_FAILED]
  required_evidence:
    - source: kubernetes.events
      operator: equals
      value: FailedScheduling
  abstention_expected: false
budgets:
  diagnosis_timeout_seconds: 180
  max_tool_calls: 12
cleanup:
  action: delete_manifest
