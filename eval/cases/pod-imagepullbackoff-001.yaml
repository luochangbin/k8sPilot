schema_version: eval.k8spilot.io/v1alpha1
id: pod-imagepullbackoff-001
case_version: "2"
description: COARSE by design - the registry may be unreachable, so only the pull failure itself is deterministically injectable (see pod-image-notfound-001 for the preflight-gated strict case)
target:
  apiVersion: v1
  kind: Pod
  namespace: eval-pod-imagepullbackoff-001
  name: imagepull-demo
setup:
  manifests:
    - manifests/pod-imagepullbackoff-001.yaml
inject:
  action: apply
ready_when:
  type: jsonpath_equals
  path: status.containerStatuses[0].state.waiting.reason
  value: "ImagePullBackOff"
  timeout_seconds: 120
ground_truth:
  accepted_root_cause_codes: [IMAGE_PULL_FAILED]
  required_evidence:
    - source: kubernetes.status
      path: actual_state.container_states[0].reason
      operator: equals
      value: ImagePullBackOff
  abstention_expected: false
budgets:
  diagnosis_timeout_seconds: 180
  max_tool_calls: 12
cleanup:
  action: delete_manifest
