apiVersion: v1
kind: Namespace
metadata:
  name: eval-pvc-missing-pv-001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: missing-pv-claim
  namespace: eval-pvc-missing-pv-001
spec:
  accessModes: [ReadWriteOnce]
  volumeName: does-not-exist-pv
  resources:
    requests:
      storage: 1Gi
