apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-healthy-001
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy-demo
  namespace: eval-pod-healthy-001
  labels:
    app: healthy-demo
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
