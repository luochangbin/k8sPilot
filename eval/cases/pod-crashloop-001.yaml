schema_version: eval.k8spilot.io/v1alpha1
id: pod-crashloop-001
case_version: "2"
description: Application exits immediately with code 1 on start (CrashLoopBackOff is the symptom)
target:
  apiVersion: v1
  kind: Pod
  namespace: eval-pod-crashloop-001
  name: crashloop-demo
setup:
  manifests:
    - manifests/pod-crashloop-001.yaml
inject:
  action: apply
ready_when:
  type: jsonpath_equals
  path: status.containerStatuses[0].state.waiting.reason
  value: "CrashLoopBackOff"
  timeout_seconds: 120
ground_truth:
  accepted_root_cause_codes: [APPLICATION_EXIT_NONZERO]
  required_evidence:
    - source: kubernetes.status
      path: actual_state.container_states[0].reason
      operator: equals
      value: CrashLoopBackOff
    - source: kubernetes.status
      path: actual_state.container_states[0].last_termination.exit_code
      operator: equals
      value: 1
  abstention_expected: false
budgets:
  diagnosis_timeout_seconds: 180
  max_tool_calls: 12
cleanup:
  action: delete_manifest
