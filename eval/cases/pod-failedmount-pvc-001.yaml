schema_version: eval.k8spilot.io/v1alpha1
id: pod-failedmount-pvc-001
case_version: "2"
description: Pod stays Pending because its PVC never binds (no matching StorageClass); the scheduling error names the unbound claim
target:
  apiVersion: v1
  kind: Pod
  namespace: eval-pod-failedmount-pvc-001
  name: failedmount-pvc-demo
setup:
  manifests:
    - manifests/pod-failedmount-pvc-001.yaml
inject:
  action: apply
ready_when:
  type: jsonpath_equals
  path: status.phase
  value: "Pending"
  timeout_seconds: 90
ground_truth:
  accepted_root_cause_codes: [PVC_UNBOUND]
  required_evidence:
    - source: kubernetes.events
      operator: contains
      value: unbound immediate PersistentVolumeClaims
    - source: kubernetes.status
      path: actual_state.phase
      operator: equals
      value: Pending
  abstention_expected: false
budgets:
  diagnosis_timeout_seconds: 180
  max_tool_calls: 12
cleanup:
  action: delete_manifest
